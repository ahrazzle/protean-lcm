[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "protean-lcm"
version = "0.1.0"
description = "Opt-in DAG context engine (Lossless Context Management) plugin for Hermes Agent. Compacts a conversation range into a lineage-bearing summary node and keeps the raw messages recoverable through bounded pages."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mozi", email = "mozi@askaconsult.com" }]
keywords = [
  "hermes-agent",
  "plugin",
  "context-engine",
  "context-compaction",
  "lossless-context-management",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/ahrazzle/protean-lcm"
Source = "https://github.com/ahrazzle/protean-lcm"

# Hermes discovers installed plugins through this entry-point group. The target
# is a module that exposes `register(ctx)` at module level, which is what the
# host's plugin loader expects for a pip-distributed plugin.
[project.entry-points."hermes_agent.plugins"]
"protean-lcm" = "protean_lcm"

[tool.setuptools]
packages = ["protean_lcm"]

# The engine source lives at the repository's mirror of the in-tree plugin
# path, so the same directory works as a directory plugin in a Hermes source
# tree and as this distribution's `protean_lcm` package.
[tool.setuptools.package-dir]
protean_lcm = "plugins/context_engine/lcm"

[tool.setuptools.package-data]
protean_lcm = [
  "skills/hermes-lcm/SKILL.md",
  "skills/hermes-lcm/references/*.md",
]

[tool.setuptools.exclude-package-data]
protean_lcm = ["__pycache__/*", "*.pyc"]
